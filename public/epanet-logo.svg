<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="epanetBg" x1="12" y1="8" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0284c7" />
      <stop offset="55%" stopColor="#0369a1" />
      <stop offset="100%" stopColor="#0f766e" />
    </linearGradient>
    <linearGradient id="epanetDrop" x1="60" y1="18" x2="60" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#e0f2fe" />
      <stop offset="60%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <linearGradient id="epanetWave" x1="26" y1="70" x2="94" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2dd4bf" />
      <stop offset="100%" stopColor="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Rounded emblem shield -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="url(#epanetBg)" stroke="#38bdf8" strokeWidth="3" />

  <!-- Subtle hydraulic grid rings -->
  <circle cx="60" cy="60" r="42" stroke="#7dd3fc" strokeOpacity="0.22" strokeWidth="1.5" strokeDasharray="4 4" />

  <!-- Central Water Droplet -->
  <path
    d="M60 18C60 18 31 52 31 72C31 88.0163 43.9837 101 60 101C76.0163 101 89 88.0163 89 72C89 52 60 18 60 18Z"
    fill="url(#epanetDrop)"
    stroke="#e0f2fe"
    strokeWidth="2.5"
  />

  <!-- Water surface wave inside droplet -->
  <path
    d="M33 74C42 68 51 80 60 74C69 68 78 78 87 73C86.2 87.5 74.5 99 60 99C45.5 99 33.8 87.5 33 74Z"
    fill="url(#epanetWave)"
    opacity="0.88"
  />

  <!-- EPANET Pipe Network Links -->
  <g stroke="#082f49" strokeWidth="3.2" strokeLinecap="round">
    <line x1="60" y1="42" x2="45" y2="62" />
    <line x1="60" y1="42" x2="75" y2="62" />
    <line x1="45" y1="62" x2="75" y2="62" />
    <line x1="45" y1="62" x2="52" y2="82" />
    <line x1="75" y1="62" x2="68" y2="82" />
    <line x1="52" y1="82" x2="68" y2="82" />
  </g>

  <!-- EPANET Junction & Tank Nodes -->
  <circle cx="60" cy="42" r="5.5" fill="#ffffff" stroke="#082f49" strokeWidth="2.5" />
  <circle cx="45" cy="62" r="5" fill="#fef08a" stroke="#082f49" strokeWidth="2.4" />
  <circle cx="75" cy="62" r="5" fill="#fef08a" stroke="#082f49" strokeWidth="2.4" />
  <circle cx="52" cy="82" r="4.8" fill="#a7f3d0" stroke="#082f49" strokeWidth="2.4" />
  <circle cx="68" cy="82" r="4.8" fill="#a7f3d0" stroke="#082f49" strokeWidth="2.4" />
</svg>
